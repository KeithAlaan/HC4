<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Keith Marten Alaan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@400;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="page">
  <section class="left">
    <div class="polaroid">
      <span class="tape" aria-hidden="true"></span>
      <button class="pframe" id="pframe" aria-label="Photo of Keith. Press to preview a different photo.">
        <span class="ini" id="ini">KA</span>
        <img id="pic" alt="Photo of Keith Marten Alaan" hidden>
      </button>
      <p class="pcap">keith.jpg</p>
      <input type="file" id="file" accept="image/*" hidden>
    </div>
    <h1 class="name">Keith Marten Alaan</h1>
    <p class="tag" id="tag"></p>
    <div class="stickers" aria-hidden="true"><span>Student</span><span>Builder</span><span>Curious</span></div>
    <div class="row">
      <a class="btn" id="mailTop">Email me</a>
      <button class="btn alt" id="copy">Copy email</button>
    </div>
    <p class="tip">Tip: tap a reply in the chat, or type your own question.</p>
  </section>

  <section class="phone" aria-label="Chat with Keith">
    <header class="head">
      <span class="av"><span id="avIni">K</span><img id="avPic" alt="" hidden></span>
      <div class="who"><b>Keith Marten Alaan</b><small><i></i>online · replies instantly</small></div>
      <span class="pill" id="timer" title="Time you have spent here">0:00</span>
      <button class="ib" id="theme" aria-pressed="false" aria-label="Switch dark mode" title="Dark mode">Dark</button>
      <button class="ib" id="restart" aria-label="Restart chat" title="Restart chat">Reset</button>
    </header>
    <div class="chat" id="chat" role="log" aria-live="polite"></div>
    <div class="chips" id="chips" aria-label="Suggested replies"></div>
    <form class="form" id="form" autocomplete="off">
      <input id="inp" type="text" maxlength="80" placeholder="Type a message, like “skills”" aria-label="Type a message">
      <button class="send" aria-label="Send message">Send</button>
    </form>
  </section>
</div>
<canvas id="fx" aria-hidden="true"></canvas>
<div class="toast" id="toast" role="status"></div>
<script src="script.js"></script>
</body>
</html>
